name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag and package version
        shell: bash
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "atc-rs") | .version')"
          if [[ -z "${package_version}" || "${package_version}" == "null" ]]; then
            echo "could not determine the atc-rs package version" >&2
            exit 1
          elif [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo package version ${package_version}" >&2
            exit 1
          fi

      - name: Verify third-party license inventory
        shell: bash
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli

          cargo about generate about.hbs \
            -o "${RUNNER_TEMP}/THIRD_PARTY_LICENSES.html"

          python3 - \
            THIRD_PARTY_LICENSES.html \
            "${RUNNER_TEMP}/THIRD_PARTY_LICENSES.html" <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class UsedByParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_used_by = False
                  self.in_link = False
                  self.buf = []
                  self.packages = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag == "ul":
                      classes = attrs.get("class", "").split()
                      if "license-used-by" in classes:
                          self.in_used_by = True

                  elif tag == "a" and self.in_used_by:
                      self.in_link = True
                      self.buf = []

              def handle_data(self, data):
                  if self.in_link:
                      self.buf.append(data)

              def handle_endtag(self, tag):
                  if tag == "a" and self.in_link:
                      value = "".join(self.buf).strip()
                      if value:
                          self.packages.append(value)
                      self.in_link = False
                      self.buf = []

                  elif tag == "ul" and self.in_used_by:
                      self.in_used_by = False

          def inventory(path):
              parser = UsedByParser()
              parser.feed(Path(path).read_text(encoding="utf-8"))
              return Counter(parser.packages)

          committed = inventory(sys.argv[1])
          generated = inventory(sys.argv[2])

          if committed != generated:
              missing = generated - committed
              extra = committed - generated

              if missing:
                  print("Missing from committed license inventory:", file=sys.stderr)
                  for package, count in sorted(missing.items()):
                      print(f"  {package} x{count}", file=sys.stderr)

              if extra:
                  print("Extra in committed license inventory:", file=sys.stderr)
                  for package, count in sorted(extra.items()):
                      print(f"  {package} x{count}", file=sys.stderr)

              sys.exit(1)

          print("Third-party license package inventory is current.")
          PY

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify host architecture
        shell: pwsh
        run: |
          rustc -vV
          $hostTriple = (rustc -vV | Select-String '^host: ').Line.Split()[-1]
          if ($hostTriple -ne 'x86_64-pc-windows-msvc') {
            throw "unexpected Windows Rust host: $hostTriple"
          }

      - name: Test
        run: cargo test --locked --all-features --no-fail-fast

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          New-Item -ItemType Directory -Force release-package

          Copy-Item `
            target/x86_64-pc-windows-msvc/release/atc.exe `
            release-package/atc.exe
          Copy-Item LICENSE release-package/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md release-package/THIRD_PARTY_NOTICES.md
          Copy-Item THIRD_PARTY_LICENSES.html release-package/THIRD_PARTY_LICENSES.html

          Compress-Archive `
            -Path release-package/* `
            -DestinationPath "dist/atc-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    needs: validate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify host architecture
        run: |
          uname -m
          rustc -vV
          test "$(uname -m)" = "arm64"
          test "$(rustc -vV | awk '/^host: / { print $2 }')" = "aarch64-apple-darwin"

      - name: Test
        run: cargo test --locked --all-features --no-fail-fast

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/atc
          file target/aarch64-apple-darwin/release/atc | grep -Eq 'Mach-O 64-bit executable arm64'

      - name: Package
        run: |
          mkdir -p dist release-package

          cp target/aarch64-apple-darwin/release/atc release-package/atc
          cp LICENSE release-package/LICENSE
          cp THIRD_PARTY_NOTICES.md release-package/THIRD_PARTY_NOTICES.md
          cp THIRD_PARTY_LICENSES.html release-package/THIRD_PARTY_LICENSES.html

          tar -C release-package \
            -czf "dist/atc-${{ github.ref_name }}-macos-aarch64.tar.gz" \
            atc \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            THIRD_PARTY_LICENSES.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs:
      - validate
      - windows
      - macos

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum atc-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "${GITHUB_REF_NAME}"
            "--verify-tag"
            "--generate-notes"
          )

          version_without_build="${GITHUB_REF_NAME%%+*}"
          if [[ "${version_without_build}" == *-* ]]; then
            args+=("--prerelease" "--latest=false")
          fi

          gh release create \
            "${args[@]}" \
            dist/*
