name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag and package version
        shell: bash
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "atc-rs") | .version')"
          if [[ -z "${package_version}" || "${package_version}" == "null" ]]; then
            echo "could not determine the atc-rs package version" >&2
            exit 1
          elif [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo package version ${package_version}" >&2
            exit 1
          fi

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify host architecture
        shell: pwsh
        run: |
          rustc -vV
          $hostTriple = (rustc -vV | Select-String '^host: ').Line.Split()[-1]
          if ($hostTriple -ne 'x86_64-pc-windows-msvc') {
            throw "unexpected Windows Rust host: $hostTriple"
          }

      - name: Test
        run: cargo test --locked --all-features --no-fail-fast

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive `
            -Path target/x86_64-pc-windows-msvc/release/atc.exe `
            -DestinationPath "dist/atc-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    needs: validate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify host architecture
        run: |
          uname -m
          rustc -vV
          test "$(uname -m)" = "arm64"
          test "$(rustc -vV | awk '/^host: / { print $2 }')" = "aarch64-apple-darwin"

      - name: Test
        run: cargo test --locked --all-features --no-fail-fast

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/atc
          file target/aarch64-apple-darwin/release/atc | grep -Eq 'Mach-O 64-bit executable arm64'

      - name: Package
        run: |
          mkdir -p dist
          tar -C target/aarch64-apple-darwin/release \
            -czf "dist/atc-${{ github.ref_name }}-macos-aarch64.tar.gz" \
            atc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs:
      - validate
      - windows
      - macos

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum atc-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "${GITHUB_REF_NAME}"
            "--verify-tag"
            "--generate-notes"
          )

          version_without_build="${GITHUB_REF_NAME%%+*}"
          if [[ "${version_without_build}" == *-* ]]; then
            args+=("--prerelease" "--latest=false")
          fi

          gh release create \
            "${args[@]}" \
            dist/*
