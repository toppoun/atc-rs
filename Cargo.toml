[package]
name = "atc-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
etcetera = "0.11.0"
reqwest = { version = "0.13.4", features = ["blocking", "cookies"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.4"
wait-timeout = "0.2.1"
