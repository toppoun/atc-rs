[package]
name = "atc-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "atc"
path = "src/main.rs"

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
clap = { version = "4.6.6", features = ["derive", "string"] }
etcetera = "0.11.0"
notify = "8.2.0"
ratatui = { version = "0.30.2", default-features = false, features = [
    "all-widgets",
    "layout-cache",
    "macros",
    "termina",
    "underline-color",
    "unstable-backend-writer",
] }
reqwest = { version = "0.13.4", features = ["blocking", "cookies"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
termina = { git = "https://github.com/toppoun/termina", rev = "6c208fd5ce149db85625af75f7b526424d605550" }
tempfile = "3.27.0"
toml = "1.1.4"
wait-timeout = "0.2.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
regex = "1.13.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[patch.crates-io]
termina = { git = "https://github.com/toppoun/termina", rev = "6c208fd5ce149db85625af75f7b526424d605550" }
