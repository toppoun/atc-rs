[package]
name = "atc-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
clap = { version = "4.6.6", features = ["derive", "string"] }
crossterm = "0.29.0"
etcetera = "0.11.0"
notify = "8.2.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["blocking", "cookies"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.4"
wait-timeout = "0.2.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
regex = "1.13.1"
